---
all:
  children:
    fog_servers:
      hosts:
        srv-fog:
          ansible_host: "{{ fog_server_ip }}"
          ansible_user: "{{ vault_fog_user }}"
          ansible_ssh_pass: "{{ vault_fog_password }}"
          ansible_become_pass: "{{ vault_fog_password }}"
    win_hosts:
      hosts:
        win11-ref:
          ansible_host: "{{ win_reference_ip }}"
          ansible_user: "{{ vault_winrm_user }}"
          ansible_password: "{{ vault_winrm_password }}"
          ansible_connection: winrm
          ansible_winrm_transport: basic
          ansible_winrm_server_cert_validation: ignore
          ansible_port: 5985
# Les postes physiques et les adresses internes restent dans un inventaire local.
