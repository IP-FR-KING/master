---
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/sysprep-win11.yml --ask-vault-pass
# Responsabilité : Déployer unattend.xml + exécuter Sysprep sur win11-reference
#
# ⚠️  ACTION DESTRUCTIVE — La VM sera généralisée et éteinte automatiquement.
#    Ne PAS redémarrer sous Windows après ce playbook.
#    Prochaine étape : boot PXE → capture FOG.
#
# Prérequis :
#   - customize-win11-reference.yml exécuté avec succès
#   - win11-reference démarrée sous Windows, WinRM actif

- name: Sysprep Windows 11 reference image
  hosts: "{{ sysprep_target | default('win_hosts') }}"
  gather_facts: false

  vars:
    sysprep_unattend_path: 'C:\Windows\Panther\unattend.xml'
    sysprep_exe: 'C:\Windows\System32\Sysprep\sysprep.exe'

  tasks:

    - name: "Préconditions | Confirmer la généralisation de la VM de référence"
      ansible.builtin.assert:
        that:
          - sysprep_confirm | default(false) | bool
          - not ansible_check_mode
          - vault_win_local_password is defined
          - vault_win_local_password | default('') | length >= 12
          - vault_win_local_password | default('') != 'CHANGE_ME'
          - win_local_admin | lower != 'administrateur'
          - win_local_admin | lower != 'administrator'
        fail_msg: >-
          Créer un snapshot de la VM, définir un compte administrateur dédié et
          un mot de passe local de 12 caractères minimum, puis passer
          -e sysprep_confirm=true. Le mode --check ne lance pas Sysprep.
        quiet: true
      no_log: true

    - name: "Préconditions | Identifier Windows et les redémarrages en attente"
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.ProductType -ne 1 -or [int]$os.BuildNumber -lt 22000) {
              throw 'Une VM Windows 11 cliente est requise.'
          }
          $pending = Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending'
          $pending = $pending -or (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired')
          $rename = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue
          if ($pending -or $rename) {
              throw 'Redémarrage en attente : redémarrer Windows et vérifier les mises à jour avant Sysprep.'
          }
          $corrupt = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Setup\Sysprep' -Name SysprepCorrupt -ErrorAction SilentlyContinue
          if ($corrupt -and $corrupt.SysprepCorrupt) {
              throw 'Échec Sysprep antérieur : conserver les journaux Panther et diagnostiquer avant de relancer.'
          }
          $os | Select-Object Caption, Version, BuildNumber

    # -------------------------------------------------------------------------
    # 3. Déployer unattend.xml depuis le template Jinja2
    # -------------------------------------------------------------------------

    - name: "Unattend | S'assurer que le repertoire Panther existe"
      ansible.windows.win_file:
        path: C:\Windows\Panther
        state: directory

    - name: "Unattend | Déployer unattend.xml (rendu depuis le template Jinja2)"
      ansible.windows.win_template:
        src: templates/unattend.xml.j2
        dest: "{{ sysprep_unattend_path }}"
      no_log: true

    - name: "Unattend | Vérifier le fichier déployé"
      ansible.windows.win_stat:
        path: "{{ sysprep_unattend_path }}"
      register: unattend_stat

    - name: "Unattend | Échec si unattend.xml absent"
      ansible.builtin.fail:
        msg: "unattend.xml non trouvé à {{ sysprep_unattend_path }} — arrêt avant Sysprep."
      when: not unattend_stat.stat.exists

    # -------------------------------------------------------------------------
    # 4. ⚠️  SYSPREP — Point de non-retour
    #    La connexion WinRM sera perdue lors de l'arrêt (normal)
    # -------------------------------------------------------------------------

    - name: "AVERTISSEMENT — Sysprep imminent"
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "⚠️  SYSPREP VA ÊTRE LANCÉ SUR {{ inventory_hostname }} ({{ ansible_host }})"
          - "  Commande : sysprep.exe /generalize /oobe /shutdown"
          - "  unattend : {{ sysprep_unattend_path }}"
          - "La machine sera GÉNÉRALISÉE et ÉTEINTE automatiquement."
          - "La connexion WinRM sera perdue — c'est attendu."
          - "Ne PAS redémarrer sous Windows après cette étape."
          - "Prochaine étape : boot PXE → capture FOG."
          - "================================================================"

    - name: "Sysprep | Lancer sysprep /generalize /oobe /shutdown avec unattend.xml"
      # async + poll:0 = fire-and-forget (la VM s'éteint, WinRM coupe — attendu)
      ansible.windows.win_shell: >
        {{ sysprep_exe }} /generalize /oobe /shutdown /unattend:"{{ sysprep_unattend_path }}"
      async: 300
      poll: 0
      changed_when: true

    - name: "Sysprep | Sysprep lancé en arrière-plan — attendre l'arrêt de la VM"
      ansible.builtin.debug:
        msg:
          - "Commande transmise ; cela ne confirme pas le succès de Sysprep. Vérifier l'arrêt et les journaux sur le PC."
          - "Surveiller l'état : virsh domstate win11-ref"
          - "Quand shut off : configurer boot PXE et lancer la capture FOG."
